name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-azd@v2
      - name: Compile Bicep templates
        run: |
          export POSTGRES_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export REGIMPACT_JWT_SECRET="$(openssl rand -hex 32)"
          az bicep build --file infra/main.bicep --outfile /tmp/regimpact-main.json
          az bicep build-params --file infra/staging.bicepparam --outfile /tmp/regimpact-staging.json
          az bicep build-params --file infra/production.bicepparam --outfile /tmp/regimpact-production.json
          ./scripts/validate-deployment-config.sh
      - name: Reject generated secrets and local environment files
        run: |
          test ! -f .env
          ! git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}'

  api-domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e '.[dev]'
      - name: Test deterministic domain core
        working-directory: apps/api
        run: >-
          pytest -q
          tests/test_change_detection.py
          tests/test_mapping_evaluation.py
          tests/test_clause_classifier.py
          tests/test_clause_classification_service.py
          tests/test_clause_annotations.py
          tests/test_corpus_execution.py
          tests/test_classifier_training_governance.py
      - name: Validate classifier command contracts
        working-directory: apps/api
        run: |
          python scripts/evaluate_clause_baseline.py --help
          python scripts/train_clause_classifier.py --help
          python scripts/prepare_clause_annotation_queue.py --help
          python scripts/execute_real_clause_corpus.py --help
          python scripts/adjudicate_clause_dataset.py --help
          python scripts/audit_clause_dataset.py --help
          python scripts/promote_clause_classifier.py --help

  api-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: regimpact_test
          POSTGRES_USER: regimpact
          POSTGRES_PASSWORD: regimpact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regimpact -d regimpact_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REGIMPACT_DATABASE_URL: postgresql+psycopg://regimpact:regimpact@localhost:5432/regimpact_test
      TEST_DATABASE_URL: postgresql+psycopg://regimpact:regimpact@localhost:5432/regimpact_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff check src tests migrations
      - run: mypy src
      - run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
