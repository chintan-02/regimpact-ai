name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-azd@v2
      - name: Compile Bicep templates
        run: |
          export POSTGRES_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export REGIMPACT_JWT_SECRET="$(openssl rand -hex 32)"
          az bicep build --file infra/main.bicep --outfile /tmp/regimpact-main.json
          az bicep build-params --file infra/staging.bicepparam --outfile /tmp/regimpact-staging.json
          az bicep build-params --file infra/production.bicepparam --outfile /tmp/regimpact-production.json
          ./scripts/validate-deployment-config.sh
      - name: Scan newly changed secrets and forbidden artifacts
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify "$BASELINE_REF^{commit}" >/dev/null 2>&1; then
            BASELINE_REF="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASELINE_REF" HEAD |
            python3 -m scripts.security_scan \
              --repository . \
              --baseline-ref "$BASELINE_REF" \
              --paths-from-stdin

  api-domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e '.[dev]'
      - name: Test deterministic domain core
        working-directory: apps/api
        run: >-
          pytest -q
          tests/test_change_detection.py
          tests/test_mapping_evaluation.py
          tests/test_clause_classifier.py
          tests/test_clause_classification_service.py
          tests/test_clause_annotations.py
          tests/test_corpus_acquisition.py
          tests/test_corpus_execution.py
          tests/test_rights_review.py
          tests/test_xml_section_extraction.py
          tests/test_annotation_sampling.py
          tests/test_annotation_campaign.py
          tests/test_silver_labeling.py
          tests/test_annotation_workspace.py
          tests/test_classifier_training_governance.py
      - name: Validate classifier command contracts
        working-directory: apps/api
        run: |
          python scripts/evaluate_clause_baseline.py --help
          python scripts/train_clause_classifier.py --help
          python scripts/prepare_clause_annotation_queue.py --help
          python scripts/acquire_regulatory_corpus.py --help
          python scripts/review_corpus_rights.py --help
          python scripts/extract_regulatory_sections.py --help
          python scripts/prepare_annotation_pilot.py --help
          python scripts/report_annotation_pilot.py --help
          python scripts/export_annotation_pilot.py --help
          python scripts/build_annotation_workspace.py --help
          python scripts/prepare_annotation_campaign.py --help
          python scripts/report_annotation_campaign.py --help
          python scripts/export_annotation_campaign.py --help
          python scripts/prepare_silver_experiment.py --help
          python scripts/run_silver_labeler.py --help
          python scripts/compile_silver_consensus.py --help
          python scripts/prepare_silver_adjudication.py --help
          python scripts/compile_silver_adjudication.py --help
          python scripts/report_human_evaluation.py --help
          python scripts/acquire_regulatory_corpus.py --validate-only \
            --manifest ../../datasets/clause-classifier/v0.6c/corpus-manifest.json \
            --lock ../../datasets/clause-classifier/v0.6c/acquisition-lock.json \
            --output-dir /tmp/unused-corpus \
            --receipt /tmp/unused-receipt.json
          python scripts/review_corpus_rights.py validate \
            --require-pending \
            --manifest ../../datasets/clause-classifier/v0.6c/corpus-manifest.json \
            --lock ../../datasets/clause-classifier/v0.6c/acquisition-lock.json \
            --review ../../datasets/clause-classifier/v0.6c/rights-review-packet.json
          python scripts/execute_real_clause_corpus.py --help
          python scripts/adjudicate_clause_dataset.py --help
          python scripts/audit_clause_dataset.py --help
          python scripts/promote_clause_classifier.py --help

  api-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: regimpact_test
          POSTGRES_USER: regimpact
          POSTGRES_PASSWORD: regimpact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regimpact -d regimpact_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REGIMPACT_DATABASE_URL: postgresql+psycopg://regimpact:regimpact@localhost:5432/regimpact_test
      TEST_DATABASE_URL: postgresql+psycopg://regimpact:regimpact@localhost:5432/regimpact_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]' 'pip-audit>=2.8,<3'
      - run: alembic upgrade head
      - run: ruff check src tests migrations
      - run: mypy src
      - run: pytest -q
      - run: python -m pip_audit

  web-build:
    runs-on: ubuntu-latest
    services:
      console-redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test web authentication including Redis integration
        env:
          REGIMPACT_TEST_CONSOLE_REDIS_URL: redis://127.0.0.1:6380/0
        run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete dependency tree
        run: npm audit --audit-level=high
